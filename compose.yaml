services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://127.0.0.1:9092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 15s
  spark-test:
    profiles: ["tools"]
    build:
      context: ./docker/spark
    image: bdsma-spark:3.5.7
    user: "0:0"
    working_dir: /workspace
    mem_limit: 2g
    cpus: 2
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - .:/workspace
      - spark_ivy:/tmp/bdsma-ivy
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - local[2]
      - --conf
      - spark.jars.ivy=/tmp/bdsma-ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7
      - /workspace/scripts/test_kafka_spark.py
      - --debug
  preprocess:
    profiles: ["tools"]
    extends:
      service: spark-test
    command:
      - --master
      - local[2]
      - /workspace/scripts/preprocess_tweetskb.py
      - --month
      - "2019-10"
  streamer:
    profiles: ["app"]
    extends:
      service: spark-test
    volumes:
      - spark_state:/state
    environment:
      BDSMA_STATE_DIR: /state
    command:
      - --master
      - local[2]
      - --conf
      - spark.jars.ivy=/tmp/bdsma-ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7
      - /workspace/scripts/stream_hashtags.py
volumes:
  kafka_data:
  spark_ivy:
  spark_state:
